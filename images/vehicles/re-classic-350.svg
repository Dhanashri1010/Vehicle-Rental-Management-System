<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
    <defs>
      <linearGradient id="bikeBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#e2e8f0"/>
      </linearGradient>
    </defs>
    <rect width="500" height="320" rx="16" fill="url(#bikeBg)"/>
    
    <!-- Shadow -->
    <ellipse cx="250" cy="275" rx="195" ry="14" fill="#cbd5e1"/>
    
    <!-- Rear Wheel -->
    <circle cx="110" cy="210" r="58" fill="#1e293b"/>
    <circle cx="110" cy="210" r="38" fill="#94a3b8"/>
    <circle cx="110" cy="210" r="16" fill="#475569"/>
    <!-- Spokes -->
    <line x1="60" y1="210" x2="160" y2="210" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="110" y1="160" x2="110" y2="260" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Front Wheel -->
    <circle cx="390" cy="210" r="58" fill="#1e293b"/>
    <circle cx="390" cy="210" r="38" fill="#94a3b8"/>
    <circle cx="390" cy="210" r="16" fill="#475569"/>
    <line x1="340" y1="210" x2="440" y2="210" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="390" y1="160" x2="390" y2="260" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Motorcycle Chassis -->
    <polygon points="110,210 230,210 280,140 180,140" fill="#334155" opacity="0.8"/>
    
    <!-- Engine Block / Crankcase -->
    <rect x="200" y="170" width="60" height="50" rx="10" fill="#475569"/>
    <line x1="200" y1="180" x2="260" y2="180" stroke="#94a3b8" stroke-width="3"/>
    <line x1="200" y1="195" x2="260" y2="195" stroke="#94a3b8" stroke-width="3"/>
    <line x1="200" y1="210" x2="260" y2="210" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Long Chrome / Black Silencer Exhaust -->
    <path d="M 230 215 L 140 225 L 80 220" stroke="#64748b" stroke-width="12" stroke-linecap="round" fill="none"/>
    <rect x="80" y="214" width="70" height="12" rx="4" fill="#94a3b8"/>
    
    <!-- Fuel Tank -->
    <path d="M 220 125 C 240 100, 310 95, 330 135 L 230 145 Z" fill="#78350f"/>
    <circle cx="280" cy="115" r="5" fill="#f8fafc"/>
    
    <!-- Seat -->
    <path d="M 140 130 C 170 120, 220 120, 240 135 L 230 148 L 140 140 Z" fill="#1e293b"/>
    
    <!-- Front Fork & Handlebar -->
    <line x1="390" y1="210" x2="340" y2="70" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="340" cy="70" r="8" fill="#1e293b"/>
    <line x1="320" y1="65" x2="360" y2="65" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Round/Sport Headlight -->
    <circle cx="365" cy="85" r="16" fill="#fef08a" stroke="#eab308" stroke-width="3"/>
    <polygon points="370,75 420,60 420,110 370,95" fill="#fef08a" opacity="0.3"/>
    
    <!-- Rear Fender / Mudguard -->
    <path d="M 80 170 Q 110 145 150 170" stroke="#78350f" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Name Label -->
    <rect x="20" y="20" width="240" height="38" rx="10" fill="#ffffff" opacity="0.95"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Royal Enfield 350</text>
    
    
      <rect x="350" y="20" width="130" height="34" rx="8" fill="#0f8b8d"/>
      <text x="415" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">👑 Highway King</text>
    
  </svg>
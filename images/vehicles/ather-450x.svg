<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
    <defs>
      <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0fdf4"/>
        <stop offset="100%" stop-color="#e6fffa"/>
      </linearGradient>
    </defs>
    <rect width="500" height="320" rx="16" fill="url(#evBg)"/>
    
    <!-- Shadow -->
    <ellipse cx="250" cy="275" rx="190" ry="14" fill="#cbd5e1"/>
    
    <!-- Rear Aerodynamic Wheel with Green Rim -->
    <circle cx="120" cy="215" r="52" fill="#0f172a"/>
    <circle cx="120" cy="215" r="32" fill="#10b981"/>
    <circle cx="120" cy="215" r="14" fill="#0f172a"/>
    
    <!-- Front Aerodynamic Wheel with Green Rim -->
    <circle cx="380" cy="215" r="52" fill="#0f172a"/>
    <circle cx="380" cy="215" r="32" fill="#10b981"/>
    <circle cx="380" cy="215" r="14" fill="#0f172a"/>
    
    <!-- Sleek Minimalist Electric Body -->
    <path d="M 110 205 Q 150 140 220 140 L 260 210 L 320 210 L 370 120 L 350 70 L 320 70 L 290 120 Z" fill="#059669"/>
    
    <!-- Neon Battery Pack indicator -->
    <rect x="180" y="195" width="70" height="18" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="215" y="208" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#34d399" text-anchor="middle">⚡ BATTERY</text>

    <!-- Sleek Seat -->
    <path d="M 120 135 Q 180 125 240 145 L 230 155 L 130 145 Z" fill="#0f172a"/>
    
    <!-- Futuristic Sharp Front Apron -->
    <polygon points="340,65 375,120 365,190 325,185" fill="#059669"/>
    <!-- LED Light Bar -->
    <line x1="345" y1="85" x2="375" y2="120" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Touchscreen Cockpit -->
    <rect x="315" y="55" width="28" height="18" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="329" cy="64" r="3" fill="#38bdf8"/>

    <!-- Name Label -->
    <rect x="20" y="20" width="230" height="38" rx="10" fill="#ffffff" opacity="0.95"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Ather 450X Gen 3</text>
    
    <rect x="340" y="20" width="140" height="34" rx="8" fill="#059669"/>
    <text x="410" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Smart Electric</text>
  </svg>
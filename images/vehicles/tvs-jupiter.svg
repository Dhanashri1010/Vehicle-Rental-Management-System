<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
    <defs>
      <linearGradient id="scooterBg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc"/>
        <stop offset="100%" stop-color="#e2e8f0"/>
      </linearGradient>
    </defs>
    <rect width="500" height="320" rx="16" fill="url(#scooterBg)"/>
    
    <!-- Shadow -->
    <ellipse cx="250" cy="275" rx="190" ry="14" fill="#cbd5e1"/>
    
    <!-- Rear Wheel -->
    <circle cx="120" cy="220" r="50" fill="#1e293b"/>
    <circle cx="120" cy="220" r="32" fill="#94a3b8"/>
    <circle cx="120" cy="220" r="14" fill="#475569"/>
    
    <!-- Front Wheel -->
    <circle cx="380" cy="220" r="50" fill="#1e293b"/>
    <circle cx="380" cy="220" r="32" fill="#94a3b8"/>
    <circle cx="380" cy="220" r="14" fill="#475569"/>
    
    <!-- Exhaust / Engine -->
    <rect x="90" y="215" width="85" height="16" rx="6" fill="#334155"/>
    <circle cx="85" cy="223" r="10" fill="#0f172a"/>
    
    <!-- Footboard & Frame -->
    <path d="M 120 220 L 190 220 L 260 220 L 310 170 L 340 100" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="180" y="208" width="80" height="14" rx="4" fill="#0f172a"/>
    
    <!-- Main Body & Side Panel -->
    <path d="M 100 200 C 90 140, 160 120, 240 130 L 245 195 L 120 205 Z" fill="#475569"/>
    <line x1="120" y1="165" x2="220" y2="155" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Seat -->
    <path d="M 120 128 C 150 115, 230 118, 260 145 L 245 155 L 125 138 Z" fill="#1e293b"/>
    
    <!-- Front Apron / Shield -->
    <path d="M 300 175 L 345 70 L 375 75 L 365 200 Z" fill="#475569"/>
    <path d="M 350 70 L 375 75 L 365 130 Z" fill="#ffffff" opacity="0.4"/>
    
    <!-- Handlebar & Headlight -->
    <circle cx="340" cy="65" r="14" fill="#475569"/>
    <polygon points="345,55 375,50 375,70 345,68" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <line x1="320" y1="65" x2="355" y2="65" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
    <!-- Mirrors -->
    <circle cx="330" cy="40" r="7" fill="#64748b"/>
    <line x1="330" y1="47" x2="330" y2="60" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Front Mudguard -->
    <path d="M 350 180 Q 380 155 410 180" stroke="#475569" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Name Label -->
    <rect x="20" y="20" width="220" height="38" rx="10" fill="#ffffff" opacity="0.95"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">TVS Jupiter 125</text>
    
    
      <rect x="360" y="20" width="120" height="34" rx="8" fill="#10b981"/>
      <text x="420" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Huge Boot Space</text>
    
  </svg>
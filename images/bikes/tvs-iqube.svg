<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="100%" height="100%">
    <defs>
      <linearGradient id="evBg_TVSiQubeSElectric" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f0fdf4"/>
        <stop offset="100%" stop-color="#e6fffa"/>
      </linearGradient>
    </defs>
    <rect width="520" height="340" rx="20" fill="url(#evBg_TVSiQubeSElectric)"/>
    
    <!-- Ground Shadow -->
    <ellipse cx="260" cy="290" rx="200" ry="14" fill="#cbd5e1"/>
    
    <!-- Rear EV Wheel with Green Accent -->
    <circle cx="130" cy="225" r="56" fill="#0f172a"/>
    <circle cx="130" cy="225" r="35" fill="#10b981"/>
    <circle cx="130" cy="225" r="16" fill="#0f172a"/>
    
    <!-- Front EV Wheel with Green Accent -->
    <circle cx="390" cy="225" r="56" fill="#0f172a"/>
    <circle cx="390" cy="225" r="35" fill="#10b981"/>
    <circle cx="390" cy="225" r="16" fill="#0f172a"/>
    
    <!-- Minimalist Aerodynamic EV Body -->
    <path d="M 120 215 Q 160 145 230 145 L 270 220 L 330 220 L 385 125 L 365 75 L 335 75 L 305 125 Z" fill="#3b82f6"/>
    
    <!-- Battery Pack Housing -->
    <rect x="190" y="205" width="80" height="20" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="230" y="219" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle">⚡ LITHIUM-ION</text>

    <!-- Sleek Minimalist Seat -->
    <path d="M 130 145 Q 190 132 250 152 L 240 165 L 140 155 Z" fill="#0f172a"/>
    
    <!-- Futuristic Front Apron & Light Bar -->
    <polygon points="355,70 390,125 380,200 340,195" fill="#3b82f6"/>
    <line x1="360" y1="90" x2="390" y2="125" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Touchscreen Console -->
    <rect x="330" y="58" width="30" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="345" cy="68" r="3" fill="#38bdf8"/>

    <!-- Name Label -->
    <rect x="25" y="24" width="250" height="42" rx="12" fill="#ffffff" opacity="0.95" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
    <text x="38" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">TVS iQube S Electric</text>
    
    <rect x="355" y="24" width="140" height="36" rx="10" fill="#059669"/>
    <text x="425" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Whisper Quiet</text>
  </svg>
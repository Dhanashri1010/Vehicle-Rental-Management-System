<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg2)"/>
  
  <!-- Road with lane markings -->
  <rect x="0" y="320" width="600" height="80" fill="#334155"/>
  <line x1="20" y1="360" x2="100" y2="360" stroke="#f8fafc" stroke-width="6" stroke-dasharray="25,20"/>
  <line x1="140" y1="360" x2="300" y2="360" stroke="#f8fafc" stroke-width="6" stroke-dasharray="25,20"/>
  <line x1="340" y1="360" x2="580" y2="360" stroke="#f8fafc" stroke-width="6" stroke-dasharray="25,20"/>

  <!-- Delivery Pin / GPS marker -->
  <g transform="translate(140, 160)">
    <circle cx="0" cy="0" r="28" fill="#ef4444"/>
    <circle cx="0" cy="-4" r="12" fill="#ffffff"/>
    <polygon points="-16,14 16,14 0,42" fill="#ef4444"/>
    <text x="0" y="1" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444" text-anchor="middle">📍</text>
  </g>
  <text x="140" y="225" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f8b8d" text-anchor="middle">Your Doorstep</text>

  <!-- Scooter arriving -->
  <g transform="translate(320, 190)">
    <!-- Wheels -->
    <circle cx="30" cy="130" r="28" fill="#1e293b"/>
    <circle cx="30" cy="130" r="14" fill="#94a3b8"/>
    <circle cx="170" cy="130" r="28" fill="#1e293b"/>
    <circle cx="170" cy="130" r="14" fill="#94a3b8"/>
    
    <!-- Body -->
    <path d="M 20 120 L 70 120 L 100 80 L 150 70 L 180 120 Z" fill="#0f8b8d"/>
    <rect x="80" y="75" width="55" height="15" rx="5" fill="#1e293b"/>
    <!-- Front shield -->
    <path d="M 150 70 L 165 30 L 185 35 L 180 110 Z" fill="#0f8b8d"/>
    <!-- Headlight -->
    <polygon points="185,35 205,30 205,50 183,45" fill="#fef08a" opacity="0.8"/>
    
    <!-- Verified Owner Rider with Helmet -->
    <!-- Torso -->
    <rect x="90" y="0" width="35" height="60" rx="10" fill="#ffb703"/>
    <!-- Helmet -->
    <circle cx="115" cy="-18" r="22" fill="#0f8b8d"/>
    <path d="M 115 -18 L 132 -10 L 126 5 L 115 5 Z" fill="#1e293b"/>
    <text x="110" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Owner</text>
  </g>

  <!-- Speed lines -->
  <line x1="260" y1="280" x2="310" y2="280" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="300" x2="325" y2="300" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>

  <!-- Badge -->
  <rect x="360" y="40" width="200" height="50" rx="25" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <circle cx="390" cy="65" r="16" fill="#d1fae5"/>
  <text x="390" y="71" font-size="18" text-anchor="middle">✓</text>
  <text x="475" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065f46">Doorstep Delivery</text>
</svg>
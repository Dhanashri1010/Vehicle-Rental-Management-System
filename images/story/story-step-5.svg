<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg5)"/>

  <!-- Confetti / Celebration stars -->
  <polygon points="100,50 106,65 122,65 109,75 114,90 100,80 86,90 91,75 78,65 94,65" fill="#f59e0b"/>
  <polygon points="500,70 505,82 518,82 508,90 512,102 500,94 488,102 492,90 482,82 495,82" fill="#0f8b8d"/>
  <circle cx="160" cy="120" r="8" fill="#10b981"/>
  <circle cx="440" cy="110" r="10" fill="#3b82f6"/>

  <!-- Happy Character Standing with Thumbs Up -->
  <g transform="translate(300, 180)">
    <!-- Shadow -->
    <ellipse cx="0" cy="150" rx="45" ry="10" fill="#cbd5e1"/>
    <!-- Legs -->
    <line x1="-15" y1="65" x2="-15" y2="145" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    <line x1="15" y1="65" x2="15" y2="145" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    <rect x="-28" y="140" width="25" height="12" rx="6" fill="#ffb703"/>
    <rect x="5" y="140" width="25" height="12" rx="6" fill="#ffb703"/>
    <!-- Torso -->
    <rect x="-24" y="-15" width="48" height="85" rx="14" fill="#0f8b8d"/>
    <!-- Left Hand Wave -->
    <line x1="-20" y1="5" x2="-55" y2="-20" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
    <!-- Right Hand Thumbs Up -->
    <line x1="20" y1="5" x2="55" y2="-15" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
    <circle cx="62" cy="-20" r="8" fill="#fed7aa"/>
    <line x1="62" y1="-26" x2="62" y2="-14" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="0" cy="-45" r="24" fill="#fed7aa"/>
    <!-- Smile and Eyes -->
    <circle cx="-7" cy="-48" r="3" fill="#1e293b"/>
    <circle cx="7" cy="-48" r="3" fill="#1e293b"/>
    <path d="M -9 -38 Q 0 -28 9 -38" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <!-- Cap/Hair -->
    <path d="M -24 -50 Q 0 -75 24 -50 Z" fill="#ffb703"/>
  </g>

  <!-- Big Glowing Target Banner -->
  <g transform="translate(300, 60)">
    <rect x="-180" y="0" width="360" height="70" rx="35" fill="#ffffff" stroke="#ffb703" stroke-width="4" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#0f8b8d" text-anchor="middle">Ready to start your ride?</text>
    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle">Tap below to choose your vehicle 👇</text>
  </g>
</svg>
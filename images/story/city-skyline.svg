<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#skyGrad)"/>
  
  <!-- Distant Hills (Pune Western Ghats / Sinhagad silhouette) -->
  <path d="M 0 280 Q 200 210 400 270 Q 600 180 800 260 Q 1100 190 1350 270 Q 1500 230 1600 280 L 1600 400 L 0 400 Z" fill="#cbd5e1" opacity="0.4"/>
  
  <!-- Pune City Architecture -->
  <!-- Hinjewadi Tech towers -->
  <rect x="80" y="160" width="70" height="200" fill="#94a3b8" opacity="0.4"/>
  <rect x="90" y="180" width="15" height="15" fill="#ffffff" opacity="0.6"/>
  <rect x="120" y="180" width="15" height="15" fill="#ffffff" opacity="0.6"/>
  <rect x="90" y="210" width="15" height="15" fill="#ffffff" opacity="0.6"/>
  <rect x="120" y="210" width="15" height="15" fill="#ffffff" opacity="0.6"/>
  <rect x="170" y="130" width="90" height="230" fill="#64748b" opacity="0.3"/>

  <!-- Shaniwar Wada Traditional Bastion outline -->
  <path d="M 450 360 L 450 200 L 520 200 L 520 170 L 580 170 L 580 200 L 650 200 L 650 360 Z" fill="#94a3b8" opacity="0.45"/>
  <circle cx="550" cy="150" r="12" fill="#ffb703" opacity="0.8"/>

  <!-- Metro Line Pillars & Track -->
  <line x1="750" y1="240" x2="1250" y2="240" stroke="#0f8b8d" stroke-width="8" opacity="0.3"/>
  <rect x="820" y="240" width="18" height="120" fill="#0f8b8d" opacity="0.3"/>
  <rect x="970" y="240" width="18" height="120" fill="#0f8b8d" opacity="0.3"/>
  <rect x="1120" y="240" width="18" height="120" fill="#0f8b8d" opacity="0.3"/>
  
  <!-- Viman Nagar Airport flyover / trees -->
  <circle cx="1350" cy="300" r="45" fill="#10b981" opacity="0.35"/>
  <circle cx="1420" cy="290" r="55" fill="#059669" opacity="0.35"/>
  <circle cx="1500" cy="310" r="40" fill="#10b981" opacity="0.35"/>
</svg>
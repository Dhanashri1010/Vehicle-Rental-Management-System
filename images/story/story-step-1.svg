<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f4f4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg1)"/>
  
  <!-- Ground -->
  <path d="M 0 350 Q 300 340 600 350 L 600 400 L 0 400 Z" fill="#e2e8f0"/>
  
  <!-- Modern House / Porch -->
  <rect x="50" y="160" width="180" height="190" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" rx="8"/>
  <polygon points="40,160 140,90 240,160" fill="#0f8b8d"/>
  <rect x="110" y="240" width="60" height="110" fill="#ffb703" rx="4"/>
  <circle cx="155" cy="295" r="4" fill="#1e293b"/>
  <rect x="70" y="190" width="45" height="45" fill="#bae6fd" stroke="#0284c7" stroke-width="2" rx="4"/>
  
  <!-- Potted Plant -->
  <path d="M 60 330 L 65 350 L 85 350 L 90 330 Z" fill="#b45309"/>
  <circle cx="75" cy="320" r="16" fill="#10b981"/>
  <circle cx="68" cy="312" r="12" fill="#059669"/>
  <circle cx="82" cy="312" r="12" fill="#34d399"/>

  <!-- Happy Customer Character on Phone -->
  <!-- Shadow -->
  <ellipse cx="380" cy="355" rx="40" ry="10" fill="#cbd5e1"/>
  
  <!-- Legs -->
  <line x1="370" y1="260" x2="365" y2="350" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <line x1="390" y1="260" x2="395" y2="350" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <!-- Shoes -->
  <rect x="350" y="342" width="22" height="12" rx="6" fill="#ffb703"/>
  <rect x="388" y="342" width="22" height="12" rx="6" fill="#ffb703"/>

  <!-- Body / Torso -->
  <rect x="360" y="180" width="45" height="85" rx="16" fill="#0f8b8d"/>
  
  <!-- Left arm waving -->
  <path d="M 360 200 Q 320 180 315 150" fill="none" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Right arm holding phone to ear -->
  <path d="M 400 200 Q 425 210 415 165" fill="none" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
  <!-- Smartphone -->
  <rect x="408" y="145" width="16" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="382" cy="140" r="22" fill="#fed7aa"/>
  <!-- Hair -->
  <path d="M 362 135 Q 380 110 402 130 Q 405 142 398 145" fill="#1e293b"/>
  <!-- Happy Face -->
  <circle cx="376" cy="138" r="3" fill="#1e293b"/>
  <path d="M 370 148 Q 378 156 386 148" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Speech bubble with phone/wifi & tick -->
  <path d="M 430 110 Q 440 80 480 80 L 530 80 Q 560 80 560 110 L 560 140 Q 560 160 530 160 L 460 160 L 435 180 L 442 160 Q 430 155 430 140 Z" fill="#ffffff" stroke="#0f8b8d" stroke-width="3"/>
  <text x="495" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f8b8d" text-anchor="middle">Book in 1 min</text>
  <text x="495" y="140" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#10b981" text-anchor="middle">🛵 Confirmed!</text>
</svg>
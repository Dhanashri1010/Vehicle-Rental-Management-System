<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg4)"/>
  
  <!-- Pune Heritage Silhouette (Shaniwar Wada gateway outline) -->
  <path d="M 50 280 L 50 180 L 100 180 L 100 150 L 150 150 L 150 280 Z" fill="#94a3b8" opacity="0.3"/>
  <path d="M 180 280 L 180 140 L 260 140 L 260 280 Z" fill="#94a3b8" opacity="0.3"/>
  <!-- Trees in Pune -->
  <circle cx="340" cy="240" r="40" fill="#86efac" opacity="0.5"/>
  <circle cx="380" cy="230" r="35" fill="#4ade80" opacity="0.5"/>

  <!-- Road -->
  <rect x="0" y="280" width="600" height="120" fill="#1e293b"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#facc15" stroke-width="4" stroke-dasharray="30,25"/>

  <!-- Rider cruising with joy -->
  <g transform="translate(240, 150)">
    <!-- Wheels -->
    <circle cx="30" cy="140" r="32" fill="#0f172a"/>
    <circle cx="30" cy="140" r="16" fill="#cbd5e1"/>
    <circle cx="180" cy="140" r="32" fill="#0f172a"/>
    <circle cx="180" cy="140" r="16" fill="#cbd5e1"/>
    
    <!-- Bike body (Royal / Classic cruiser) -->
    <path d="M 30 140 L 80 110 L 140 105 L 180 140" stroke="#0f8b8d" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="75" y="80" width="50" height="25" rx="8" fill="#ffb703"/>
    <rect x="130" y="85" width="25" height="15" rx="4" fill="#0f172a"/>
    <line x1="160" y1="105" x2="175" y2="50" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <line x1="165" y1="50" x2="190" y2="50" stroke="#0f8b8d" stroke-width="8" stroke-linecap="round"/>

    <!-- Rider -->
    <!-- Helmet -->
    <circle cx="125" cy="0" r="22" fill="#0f8b8d"/>
    <rect x="120" y="-8" width="16" height="10" rx="3" fill="#ffffff"/>
    <!-- Jacket -->
    <rect x="100" y="20" width="40" height="55" rx="10" fill="#0f8b8d"/>
    <line x1="130" y1="35" x2="175" y2="50" stroke="#fed7aa" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 110 70 L 125 110 L 95 125" fill="none" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Speed & Wind Trails -->
  <path d="M 120 220 Q 180 215 220 220" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 90 240 Q 150 235 210 240" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Badge 24/7 Roadside Help -->
  <rect x="400" y="30" width="180" height="45" rx="22" fill="#ffffff" stroke="#0f8b8d" stroke-width="2"/>
  <text x="490" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f8b8d" text-anchor="middle">🛡️ 24/7 Pune Road Help</text>
</svg>
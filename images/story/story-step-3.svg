<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bg3)"/>
  
  <!-- Ground -->
  <rect x="0" y="340" width="600" height="60" fill="#e2e8f0"/>
  
  <!-- Left Person (Owner) -->
  <g transform="translate(180, 160)">
    <!-- Legs -->
    <line x1="-10" y1="100" x2="-10" y2="180" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <line x1="15" y1="100" x2="15" y2="180" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <rect x="-25" y="175" width="22" height="10" rx="5" fill="#1e293b"/>
    <rect x="10" y="175" width="22" height="10" rx="5" fill="#1e293b"/>
    <!-- Body -->
    <rect x="-20" y="20" width="45" height="85" rx="12" fill="#0f8b8d"/>
    <!-- Head -->
    <circle cx="2" cy="-10" r="22" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M -18 -15 Q 0 -35 22 -15 Q 18 5 5 0" fill="#334155"/>
    <!-- Smile -->
    <path d="M -4 -4 Q 2 4 10 -4" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm extending with key -->
    <line x1="20" y1="40" x2="80" y2="50" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
    <!-- Key in hand -->
    <circle cx="85" cy="50" r="7" fill="#ffb703" stroke="#b45309" stroke-width="2"/>
    <line x1="90" y1="50" x2="105" y2="50" stroke="#b45309" stroke-width="3"/>
    <line x1="100" y1="50" x2="100" y2="56" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Right Person (Customer) receiving -->
  <g transform="translate(380, 160)">
    <!-- Legs -->
    <line x1="-15" y1="100" x2="-15" y2="180" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <line x1="10" y1="100" x2="10" y2="180" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    <rect x="-25" y="175" width="22" height="10" rx="5" fill="#ffb703"/>
    <rect x="0" y="175" width="22" height="10" rx="5" fill="#ffb703"/>
    <!-- Body -->
    <rect x="-25" y="20" width="45" height="85" rx="12" fill="#3b82f6"/>
    <!-- Head -->
    <circle cx="-2" cy="-10" r="22" fill="#fed7aa"/>
    <!-- Smile -->
    <path d="M -10 -4 Q -2 4 6 -4" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Arm reaching out to take key -->
    <line x1="-20" y1="40" x2="-70" y2="50" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
    <!-- Free Sanitized Helmet in other hand -->
    <g transform="translate(25, 45)">
      <circle cx="0" cy="0" r="20" fill="#ffb703" stroke="#b45309" stroke-width="2"/>
      <rect x="-16" y="-4" width="32" height="12" rx="4" fill="#1e293b"/>
      <text x="0" y="2" font-size="9" font-family="sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">CLEAN</text>
    </g>
  </g>

  <!-- Dialogue bubble -->
  <rect x="180" y="40" width="240" height="55" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <polygon points="300,95 290,110 310,95" fill="#10b981"/>
  <text x="300" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0f8b8d" text-anchor="middle">✨ Keys &amp; Helmet Handover</text>
  <text x="300" y="83" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Quick 2-photo vehicle check done!</text>
</svg>
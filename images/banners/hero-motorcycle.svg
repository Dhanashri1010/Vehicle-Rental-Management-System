<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f8b8d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#heroBg)"/>
  
  <!-- Subtle Grid lines -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#334155" stroke-width="2"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#334155" stroke-width="1"/>
  
  <!-- Stylized Royal Enfield Silhouette on Right -->
  <g transform="translate(620, 220)">
    <circle cx="80" cy="220" r="70" fill="none" stroke="#ffb703" stroke-width="8"/>
    <circle cx="80" cy="220" r="15" fill="#ffb703"/>
    <circle cx="420" cy="220" r="70" fill="none" stroke="#ffb703" stroke-width="8"/>
    <circle cx="420" cy="220" r="15" fill="#ffb703"/>
    
    <!-- Bike Frame & Tank -->
    <path d="M 80 220 L 220 220 L 280 130 L 360 130 L 420 220" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <path d="M 220 130 C 250 90, 330 90, 360 130 Z" fill="#ffb703"/>
    <line x1="360" y1="130" x2="410" y2="60" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <line x1="390" y1="55" x2="435" y2="55" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="435" cy="80" r="20" fill="#fef08a"/>
  </g>

  <!-- Left Content Silhouette -->
  <text x="80" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="#ffffff">Your Ride. Your Way.</text>
  <text x="80" y="290" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#94a3b8">Verified Bikes &amp; Scooters for rent across Pune with doorstep delivery.</text>
  
  <!-- Badges -->
  <g transform="translate(80, 340)">
    <rect x="0" y="0" width="180" height="48" rx="24" fill="#0f8b8d"/>
    <text x="90" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ Zero Deposit Delay</text>
    
    <rect x="200" y="0" width="180" height="48" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="290" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">⛑️ Helmet Included</text>
  </g>
</svg>
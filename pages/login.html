<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PedalPal - Two-Wheeler Rentals Pune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- TOP BRAND STRIP -->
  <header class="bg-white border-bottom py-3">
    <div class="container-fluid px-lg-5 d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
        <span class="brand-badge"><i class="bi bi-bicycle"></i></span>
        <span class="brand-text">PEDAL<span class="text-teal">PAL</span></span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-translate"></i> <span id="currentLangLabel">English</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><button class="dropdown-item lang-btn" data-lang="en">English (English)</button></li>
            <li><button class="dropdown-item lang-btn" data-lang="hi">हिंदी (Hindi)</button></li>
            <li><button class="dropdown-item lang-btn" data-lang="mr">मराठी (Marathi)</button></li>
          </ul>
        </div>
        <a href="../index.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-house-door"></i> Home</a>
      </div>
    </div>
  </header>

  <!-- LOGIN CONTAINER -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="pedal-card p-4 p-md-5">
            <div class="text-center mb-4">
              <span class="badge bg-teal-subtle text-teal fw-bold mb-2 px-3 py-1">PUNE TWO-WHEELER PORTAL</span>
              <h3 class="fw-bold mb-1">Welcome Back</h3>
              <p class="text-muted small">Log in to book bikes, manage listings, or audit platform operations.</p>
            </div>

            <!-- ALERT MESSAGE CONTAINER -->
            <div id="loginAlertBox" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-semibold">Email or Mobile Number</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="loginIdentifier" placeholder="rahul@example.com or 9823011221" required autofocus>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="form-label fw-semibold mb-0">Password</label>
                  <a href="#" class="small text-decoration-none text-teal" onclick="alert('Demo Mode: Default password is Password@123'); return false;">Forgot?</a>
                </div>
                <div class="input-group mt-1">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">Keep me signed in on this computer</label>
              </div>

              <button type="submit" class="btn btn-pedal-primary w-100 py-2 fs-6 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to PedalPal
              </button>
            </form>

            <div class="text-center my-3 position-relative">
              <hr>
              <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small fw-semibold">DEMO QUICK ACCESS</span>
            </div>

            <!-- QUICK 1-CLICK DEMO BUTTONS FOR EVALUATION -->
            <div class="d-grid gap-2">
              <button class="btn btn-sm btn-outline-teal text-start d-flex justify-content-between align-items-center quick-login-btn" data-role="customer">
                <span><i class="bi bi-person-fill text-teal me-2"></i><strong>Customer:</strong> Rahul Sharma</span>
                <span class="badge bg-teal text-white">1-Click</span>
              </button>
              <button class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center quick-login-btn" data-role="owner">
                <span><i class="bi bi-shield-check text-primary me-2"></i><strong>Bike Owner:</strong> Suresh Patil</span>
                <span class="badge bg-primary text-white">1-Click</span>
              </button>
              <button class="btn btn-sm btn-outline-dark text-start d-flex justify-content-between align-items-center quick-login-btn" data-role="admin">
                <span><i class="bi bi-gear-fill text-dark me-2"></i><strong>Administrator:</strong> Priya Deshmukh</span>
                <span class="badge bg-dark text-white">1-Click</span>
              </button>
            </div>

            <p class="text-center text-muted small mt-4 mb-0">
              Don't have an account yet? 
              <a href="register.html" class="fw-bold text-teal text-decoration-none">Sign Up Free</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-top py-3 text-center text-muted small">
    <div class="container">
      &copy; 2026 PedalPal Technologies India Pvt. Ltd. Pune, Maharashtra.
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/notifications.js"></script>
  <script>
    $(document).ready(function () {
      // Toggle password visibility
      $('#togglePasswordBtn').on('click', function () {
        const input = $('#loginPassword');
        const icon = $(this).find('i');
        if (input.attr('type') === 'password') {
          input.attr('type', 'text');
          icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
          input.attr('type', 'password');
          icon.removeClass('bi-eye-slash').addClass('bi-eye');
        }
      });

      // Quick 1-click login buttons
      $('.quick-login-btn').on('click', function () {
        const role = $(this).data('role');
        const result = Auth.quickLogin(role);
        if (result.success) {
          if (role === 'owner') {
            window.location.href = 'owner-dashboard.html';
          } else if (role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'customer-dashboard.html';
          }
        }
      });

      // Normal login form submission
      $('#loginForm').on('submit', function (e) {
        e.preventDefault();
        const ident = $('#loginIdentifier').val();
        const pwd = $('#loginPassword').val();
        const alertBox = $('#loginAlertBox');

        const result = Auth.login(ident, pwd);
        if (result.success) {
          alertBox.addClass('d-none');
          PedalPalNotifications.showToast('Login successful! Redirecting to your dashboard...', 'success');
          setTimeout(() => {
            if (result.user.role === 'owner') {
              window.location.href = 'owner-dashboard.html';
            } else if (result.user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'customer-dashboard.html';
            }
          }, 800);
        } else {
          alertBox.text(result.message).removeClass('d-none');
        }
      });
    });
  </script>
</body>
</html>
